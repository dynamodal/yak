name: CI

# Public repo, so hosted minutes are free (decision F-6).
# Every non-draft PR, every push to main and every merge queue entry runs types, unit tests, build and the browser suites.
# Shape: `build` (test build, uploaded once), `verify` (types, unit tests, production-bundle check) and two `e2e` shards run side by side;
# `Checks` waits for all of them and is the one status branch rules require, so keep its name. Every PR runs it, docs-only included.
# Pushes to main and merge queue entries also run the timer-shortened suites with their real timers (`e2e-real-timers`).
# The plugin in real Obsidian (`obsidian-app`) runs when a PR or queue entry touches the plugin or the sync code it shares, and on every push to main.
# If Actions is unavailable, scripts/ci-local.sh posts the same checks as commit statuses (docs/testing.md).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue: GitHub tests each entry combined with the entries ahead of it.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  # A newer push cancels the older run of a PR; every merge to main keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which areas a PR or merge queue entry touches; pushes and manual runs count as touching everything.
  changes:
    name: Changed areas
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      obsidian: ${{ steps.diff.outputs.obsidian }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$QUEUE_BASE" ;;
            *) echo "obsidian=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # The plugin, the shared code it bundles (src/sync, src/core, src/mirror and the few app and notes modules it imports)
          # and the test harness itself (decision O-140b). Pushes to main run it whatever changed, so a missed import shows there.
          if git diff --name-only "$base" HEAD | grep -qE '^(obsidian/|src/sync/|src/core/|src/mirror/|src/app/(account-state|key-trust|sync-filter)\.ts|src/notes/(links|space-move)\.ts|scripts/e2e/lib\.mjs|scripts/serve-dist\.mjs|scripts/mock-relay\.mjs|\.github/workflows/ci\.yml)'; then
            echo "obsidian=true" >> "$GITHUB_OUTPUT"
          else
            echo "obsidian=false" >> "$GITHUB_OUTPUT"
          fi

  # The browser suites need the `?test` hooks, which only a test build has (F-219). Built once, shared by every e2e job.
  build:
    name: Build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Types run in `verify`, so this is the bundler alone.
      - run: npm run build:ci
        env:
          YAK_TEST_BUILD: '1'
      - run: npm run check:bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-test
          path: dist
          include-hidden-files: true
          retention-days: 1

  verify:
    name: Types and unit tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:worker
      - run: npm test
      # A normal build holds none of the test hooks.
      - run: npm run check:prod-bundle

  # Two shards, balanced by scripts/e2e/durations.json (docs/testing.md). Suites that shorten product timers use the shortened ones here.
  e2e:
    name: Browser suites (${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-test
          path: dist
      - uses: ./.github/actions/chrome
      - run: npm run e2e -- --no-build --shard ${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ strategy.job-index }}
          path: e2e-logs
          retention-days: 7

  # The same suites with the product's real timers (60 s direct-path retry, 60 s relay stats refresh, 15 s link retry),
  # so they stay exercised even though the PR gate uses shortened ones. Pushes to main, merge queue entries and manual runs only.
  e2e-real-timers:
    name: Browser suites (real timers)
    needs: build
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-test
          path: dist
      - uses: ./.github/actions/chrome
      - run: npm run e2e -- --no-build --real-timers
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-real-timers
          path: e2e-logs
          retention-days: 7

  # The plugin bundle in real Obsidian desktop: the pinned minimum and the latest release (decision O-140, obsidian/e2e/).
  obsidian-app:
    name: Obsidian app
    needs: [build, changes]
    if: needs.changes.outputs.obsidian == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            obsidian/e2e/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: obsidian/e2e
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-test
          path: dist
      - uses: ./.github/actions/chrome
      - run: npm run build:obsidian
      # obsidian/e2e/run.mjs starts Obsidian on its own Xvfb (preinstalled on the runner).
      - run: npm run e2e:obsidian-app -- --no-build

  # The status branch rules require (decision F-6, F-20 area): green only when every job above is green.
  ci:
    name: Checks
    needs: [build, verify, e2e, e2e-real-timers, changes, obsidian-app]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # e2e-real-timers is skipped on pull requests, obsidian-app when nothing it covers changed; anything else must have succeeded.
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or ((.key == "e2e-real-timers" or .key == "obsidian-app") and .value.result == "skipped"))' >/dev/null
