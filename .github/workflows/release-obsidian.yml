name: Release Obsidian plugin

# Push a tag obsidian-v<version> (scripts/release-obsidian.sh --publish does this) to build and attach main.js, manifest.json and THIRD-PARTY-LICENSES.txt.
on:
  push:
    tags: ['obsidian-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            obsidian/e2e/package-lock.json
      - run: npm ci
      - name: Tag matches manifest version
        run: |
          version=$(node -p "require('./obsidian/manifest.json').version")
          [ "${GITHUB_REF_NAME}" = "obsidian-v${version}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2; exit 1; }
      # The plugin must pass in real Obsidian (the pinned minimum and the latest release) before anything is built and attached (decision O-140b).
      - run: npm ci
        working-directory: obsidian/e2e
      - uses: ./.github/actions/chrome
      - run: npm run e2e:obsidian-app
      - run: npm run build:obsidian
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./obsidian/manifest.json').version")
          gh release create "${GITHUB_REF_NAME}" obsidian/dist/main.js obsidian/dist/manifest.json obsidian/dist/THIRD-PARTY-LICENSES.txt \
            --title "Obsidian plugin ${version}" \
            --notes "Install and update with BRAT, or by hand. See obsidian/README.md."
